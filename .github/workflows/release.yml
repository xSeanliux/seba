name: Release

# Every merged pull request into main is a release, sized by its label:
# major, minor or patch (patch if none; release-label.yml requires exactly one
# before merge). A PR labelled no-release is skipped. The version lives in
# .claude-plugin/plugin.json, which is what Claude Code compares to decide that
# an installed plugin has an update.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Two merges in quick succession release one after the other, not over each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    steps:
      # The push to main goes over SSH with a write deploy key, which the
      # "Main must be PR'd" ruleset lets through. GITHUB_TOKEN cannot: on a
      # user-owned repo the Actions app cannot be a ruleset bypass actor.
      - uses: actions/checkout@v5
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@v6

      - name: Bump, commit, tag, release
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          part=patch
          for p in major minor; do
            if echo "$LABELS" | jq -e --arg p "$p" 'any(.[]; . == $p)' >/dev/null; then
              part=$p
              break
            fi
          done
          # GitHub's own Actions bot account (user id 41898282), so the release
          # commit is attributed to the bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The deploy-key push does start the CI workflow on the release
          # commit; that is harmless, and gh release create still uses GH_TOKEN.
          scripts/release.sh "$part"
